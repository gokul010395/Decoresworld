name: Build Decoresworld Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Decoresworld-Android-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish test APK in repo
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p android-app/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/downloads/Decoresworld-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android-app/downloads/Decoresworld-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'CI: publish Decoresworld debug Android APK'
            git push origin HEAD:main
          fi
